services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PROVIDER=${PROVIDER:-}
      - API_KEY=${API_KEY:-}
      - BASE_URL=${BASE_URL:-}
      - MODEL=${MODEL:-}
      - DATA_DIR=/data
      - CONFIG_PATH=/data/config.json
      - ARTIFACTS_DIR=/data/artifacts
      - DISPLAY=:2
      # Disposable containers. The token shared with docker-controller is read
      # from the controller-token volume; CONTROLLER_TOKEN overrides it.
      - CONTROLLER_URL=http://docker-controller:8090
      - CONTROLLER_TOKEN=${CONTROLLER_TOKEN:-}
      - CONTROLLER_TOKEN_FILE=${CONTROLLER_TOKEN_FILE:-/run/uagent-controller/token}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/data
      # Shared secret with docker-controller for disposable containers.
      - controller-token:/run/uagent-controller:ro
    ports:
      - "8080:8080"
    depends_on:
      - docker-controller

  # Only this service can talk to Docker. It offers exactly two operations:
  # start a disposable copy of the `backend` container, and destroy one.
  # Nothing needs to be configured: the shared token with the backend is
  # generated on first start and kept in the controller-token volume, and the
  # service opens the Docker socket as its owner (uid 0) with every capability
  # dropped. To run it as another user instead, set CONTROLLER_UID, CONTROLLER_GID
  # and DOCKER_GID (the id of the group that owns /var/run/docker.sock).
  docker-controller:
    build:
      context: ./docker-controller
      dockerfile: Dockerfile
    environment:
      - CONTROLLER_TOKEN=${CONTROLLER_TOKEN:-}
      - CONTROLLER_TOKEN_FILE=${CONTROLLER_TOKEN_FILE:-/run/uagent-controller/token}
      - SOURCE_SERVICE=backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - controller-token:/run/uagent-controller
    user: "${CONTROLLER_UID:-0}:${CONTROLLER_GID:-0}"
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3001:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080

volumes:
  # Shared secret between backend and docker-controller (filled automatically).
  controller-token:
